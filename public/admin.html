<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="row">
        <div>
          <div style="font-size:20px;font-weight:800;">管理（Master）</div>
          <div class="muted">受付/表示のON/OFF、色調整、時報（10分ごと）、QR掲示ページ</div>
        </div>
        <div class="spacer"></div>
        <span class="pill" id="eventPill">event: -</span>
      </div>
      <div style="height:8px"></div>
      <div class="row">
        <span class="muted">baseUrl:</span>
        <code id="baseUrl" style="color:#ddd;">-</code>
        <div class="spacer"></div>
        <button id="reload">config再読込</button>
      </div>
    </div>

    <div class="card">
      <div style="font-weight:800;margin-bottom:8px;">クイックリンク</div>
      <div class="row" style="gap:8px;">
        <a id="linkPost" target="_blank" rel="noreferrer">投稿</a>
        <a id="linkScreen" target="_blank" rel="noreferrer">表示</a>
        <a id="linkQrPost" target="_blank" rel="noreferrer">会場掲示QR（投稿）</a>
        <a id="linkQrScreen" target="_blank" rel="noreferrer">会場掲示QR（表示）</a>
      </div>
    </div>

    <div class="card">
      <div style="font-weight:800;margin-bottom:8px;">運用</div>
      <div class="row">
        <button class="primary" id="togglePosting">投稿: -</button>
        <button class="primary" id="toggleRendering">表示: -</button>
        <button id="clearQueue">キュークリア</button>
        <button class="danger" id="emergencyStop">緊急停止</button>
        <button id="releaseEmergency">緊急解除</button>
      </div>
      <div style="height:10px"></div>
      <div class="muted" id="stats">-</div>
      <div class="muted" style="margin-top:6px;font-size:12px;">
        ※緊急停止は「投稿停止＋表示停止＋キュークリア」を即時に行います。
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <div style="font-weight:800;margin-bottom:8px;">文字表示</div>

        <div class="row">
          <div style="flex:1">
            <div class="muted">デフォルト文字色</div>
            <input type="color" id="defaultTextColor" value="#ffffff">
          </div>
          <div style="flex:1">
            <div class="muted">縁取り色</div>
            <input type="color" id="strokeColor" value="#000000">
          </div>
        </div>

        <div style="height:10px"></div>

        <div class="row">
          <div style="flex:1">
            <div class="muted">レーン数</div>
            <input type="number" id="lanes" min="1" max="20">
          </div>
          <div style="flex:1">
            <div class="muted">速度(px/s)</div>
            <input type="number" id="speed" min="80" max="800">
          </div>
        </div>

        <div style="height:10px"></div>

        <div class="row">
          <div style="flex:1">
            <div class="muted">文字サイズ(px)</div>
            <input type="number" id="fontSize" min="20" max="120">
          </div>
          <div style="flex:1">
            <div class="muted">縁取り(px)</div>
            <input type="number" id="strokePx" min="0" max="20">
          </div>
        </div>

        <div style="height:12px"></div>
        <div class="row">
          <label class="muted"><input type="checkbox" id="forceSingleColor"> 投稿者の色を無視して一括色</label>
          <div class="spacer"></div>
          <button id="applyRenderer">反映</button>
        </div>
      </div>

      <div class="card">
        <div style="font-weight:800;margin-bottom:8px;">時報（10分ごと）</div>

        <div class="row">
          <label class="muted"><input type="checkbox" id="chimeEnabled"> 有効</label>
          <label class="muted"><input type="checkbox" id="chimePause"> 表示中はコメント停止</label>
        </div>

        <div style="height:10px"></div>

        <div class="row">
          <div style="flex:1">
            <div class="muted">間隔（分）</div>
            <input type="number" id="chimeInterval" min="1" max="60">
          </div>
          <div style="flex:1">
            <div class="muted">表示秒数</div>
            <input type="number" id="chimeDuration" min="3" max="120">
          </div>
        </div>

        <div style="height:10px"></div>
        <div class="row">
          <div style="flex:1">
            <div class="muted">表示形式</div>
            <select id="chimeFormat" style="width:100%;padding:10px;border-radius:10px;border:1px solid #333;background:#0f0f0f;color:#fff;">
              <option value="HH:mm">HH:mm</option>
              <option value="HH:mm:ss">HH:mm:ss</option>
            </select>
          </div>
        </div>

        <div style="height:12px"></div>
        <div class="row">
          <button id="applyChime">反映</button>
        </div>
        <div class="muted" style="margin-top:6px;font-size:12px;">※毎時 00/10/20/30/40/50 分あたりで約20秒表示します</div>
      </div>
    </div>

    <div class="card">
      <div style="font-weight:800;margin-bottom:8px;">投稿者の文字色</div>
      <div class="row">
        <label class="muted"><input type="checkbox" id="guestColorEnabled"> 投稿者が色を選べる</label>
        <div class="spacer"></div>
        <button id="applyGuestColors">反映</button>
      </div>
      <div style="height:10px"></div>
      <div class="muted">許可色（固定パレット）</div>
      <div class="colors" id="palette"></div>
      <div class="muted" style="margin-top:6px;font-size:12px;">※現地の見やすさ優先で「一括色」ONが便利です</div>
    </div>

    <div class="card">
      <div class="muted" id="msg" style="display:none;"></div>
    </div>

  </div>

  <script src="/static/admin.js"></script>
</body>
</html>
